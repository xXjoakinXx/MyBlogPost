<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 850" width="680" height="850" role="img" aria-labelledby="t d">
  <title id="t">Coordinator and sub-agents: ticket-to-PR flow</title>
  <desc id="d">A human writes the Jira ticket. The coordinator agent checks it is clear, otherwise it blocks and asks the developer. It defines a shared contract, then fans out to one sub-agent per affected repo, each in its own git worktree. Sub-agents implement, open a PR and check it against the contract. The coordinator gathers the results, and the PRs go through CI and human review. Single-repo tickets run sub-agents in sequential waves.</desc>
  <style>
    .bg { fill: #fbfaf7; }
    .box { fill: #ffffff; stroke: #1d1d1b; stroke-width: 1.8; }
    .coord { fill: #fdeee4; stroke: #c2410c; stroke-width: 2; }
    .ghost { fill: none; stroke: #6b6a66; stroke-width: 1.6; stroke-dasharray: 7 6; }
    .note { fill: none; stroke: #6b6a66; stroke-width: 1.4; stroke-dasharray: 4 5; }
    .line { fill: none; stroke: #1d1d1b; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .back { fill: none; stroke: #c2410c; stroke-width: 1.8; stroke-dasharray: 6 5; stroke-linecap: round; }
    .head { fill: #1d1d1b; }
    .head-a { fill: #c2410c; }
    text { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #1d1d1b; }
    .h { font-size: 17px; font-weight: 700; }
    .b { font-size: 15px; }
    .m { font-size: 13.5px; fill: #6b6a66; }
    .a { fill: #c2410c; font-weight: 600; }
    .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; fill: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #141412; }
      .box { fill: #1f1e1b; stroke: #ecebe6; }
      .coord { fill: #2c1f15; stroke: #fb923c; }
      .ghost, .note { stroke: #9c9a93; }
      .line { stroke: #ecebe6; }
      .back { stroke: #fb923c; }
      .head { fill: #ecebe6; }
      .head-a { fill: #fb923c; }
      text { fill: #ecebe6; }
      .m { fill: #9c9a93; }
      .a, .cap { fill: #fb923c; }
    }
  </style>
  <defs>
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 L2.5 5 z"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head-a" d="M0 0 L10 5 L0 10 L2.5 5 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="680" height="850"/>

  <!-- Shapes and connectors, with a hand-drawn wobble -->
  <g filter="url(#sketch)">
    <!-- 1. Ticket -->
    <rect class="box" x="90" y="40" width="300" height="86" rx="10"/>
    <!-- 2. Coordinator: is it clear? -->
    <rect class="coord" x="90" y="166" width="300" height="86" rx="10"/>
    <!-- 3. Coordinator: contract -->
    <rect class="coord" x="90" y="292" width="300" height="86" rx="10"/>
    <!-- 4. Sub-agents -->
    <rect class="box" x="20" y="438" width="205" height="138" rx="10"/>
    <rect class="box" x="237" y="438" width="206" height="138" rx="10"/>
    <rect class="ghost" x="455" y="438" width="205" height="138" rx="10"/>
    <!-- 5. Coordinator: gather -->
    <rect class="coord" x="90" y="636" width="300" height="76" rx="10"/>
    <!-- 6. CI + human review -->
    <rect class="box" x="90" y="752" width="300" height="76" rx="10"/>
    <!-- Single-repo note -->
    <rect class="note" x="430" y="636" width="225" height="192" rx="10"/>

    <!-- Flow -->
    <path class="line" d="M240 126 V162" marker-end="url(#arr)"/>
    <path class="line" d="M240 252 V288" marker-end="url(#arr)"/>
    <path class="back" d="M390 209 H440 V83 H396" marker-end="url(#arr-a)"/>
    <!-- Fan out -->
    <path class="line" d="M240 378 V404 M122 404 H558"/>
    <path class="line" d="M122 404 V434" marker-end="url(#arr)"/>
    <path class="line" d="M340 404 V434" marker-end="url(#arr)"/>
    <path class="line" d="M558 404 V434" marker-end="url(#arr)"/>
    <!-- Fan in -->
    <path class="line" d="M122 576 V604 M340 576 V604 M558 576 V604 M122 604 H558"/>
    <path class="line" d="M240 604 V632" marker-end="url(#arr)"/>
    <path class="line" d="M240 712 V748" marker-end="url(#arr)"/>
  </g>

  <!-- Labels -->
  <text class="cap" x="90" y="30">WRITTEN BY A HUMAN</text>
  <text class="h" x="240" y="72" text-anchor="middle">Jira ticket</text>
  <text class="m" x="240" y="96" text-anchor="middle">context · affected repos</text>
  <text class="m" x="240" y="115" text-anchor="middle">new behaviour · acceptance criteria</text>

  <text class="h" x="240" y="196" text-anchor="middle">Coordinator agent</text>
  <text class="b" x="240" y="220" text-anchor="middle">Is the ticket clear?</text>
  <text class="m" x="240" y="240" text-anchor="middle">context · behaviour · criteria</text>

  <text class="b a" x="454" y="126">Not clear?</text>
  <text class="m" x="454" y="148">Block and ask the</text>
  <text class="m" x="454" y="167">developer: the only</text>
  <text class="m" x="454" y="186">point where agents ask.</text>

  <text class="m" x="252" y="275">clear: go ahead</text>

  <text class="h" x="240" y="322" text-anchor="middle">Coordinator</text>
  <text class="b" x="240" y="346" text-anchor="middle">defines the shared contract</text>
  <text class="m" x="240" y="366" text-anchor="middle">branch name = Jira key</text>

  <text class="m" x="400" y="394">one sub-agent per affected repo</text>

  <text class="h" x="122" y="466" text-anchor="middle">Sub-agent</text>
  <text class="b a" x="122" y="489" text-anchor="middle">Frontend repo</text>
  <text class="m" x="122" y="516" text-anchor="middle">own git worktree</text>
  <text class="m" x="122" y="538" text-anchor="middle">explore → implement</text>
  <text class="m" x="122" y="560" text-anchor="middle">open PR → check contract</text>

  <text class="h" x="340" y="466" text-anchor="middle">Sub-agent</text>
  <text class="b a" x="340" y="489" text-anchor="middle">Backend API repo</text>
  <text class="m" x="340" y="516" text-anchor="middle">own git worktree</text>
  <text class="m" x="340" y="538" text-anchor="middle">explore → implement</text>
  <text class="m" x="340" y="560" text-anchor="middle">open PR → check contract</text>

  <text class="h" x="558" y="490" text-anchor="middle" style="fill-opacity:.7">+ one more</text>
  <text class="m" x="558" y="514" text-anchor="middle">per affected repo,</text>
  <text class="m" x="558" y="534" text-anchor="middle">all in parallel</text>

  <text class="m" x="252" y="626">results vs. contract</text>

  <text class="h" x="240" y="666" text-anchor="middle">Coordinator</text>
  <text class="b" x="240" y="692" text-anchor="middle">gathers the results: one PR per repo</text>

  <text class="h" x="240" y="782" text-anchor="middle">CI gates, then human review</text>
  <text class="m" x="240" y="806" text-anchor="middle">checks · CI healing (max 3 tries) · merge</text>
  <text class="cap" x="230" y="740" text-anchor="end">REVIEWED BY A HUMAN</text>

  <text class="b" x="446" y="664" style="font-weight:700">Single-repo tickets</text>
  <text class="m" x="446" y="690">Same flow, but no parallelism.</text>
  <text class="m" x="446" y="710">The coordinator runs its</text>
  <text class="m" x="446" y="730">sub-agents in sequential waves:</text>
  <text class="b a" x="446" y="766">wave 1 → wave 2 → …</text>
  <text class="m" x="446" y="796">Slower, but no conflicts,</text>
  <text class="m" x="446" y="816">and easy to follow.</text>
</svg>
